name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: turtlequeue/setup-babashka@v1.8.1
        with:
          babashka-version: 1.13.229

      - run: bun install --frozen-lockfile
      - run: bun run build
